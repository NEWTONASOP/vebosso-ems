name: Recover Keystore Secret (TEMPORARY)

# ============================================================
# TEMPORARY self-recovery workflow. Run once, read the values,
# then DELETE this file and the workflow run.
#
# GitHub masks secret values in logs by exact string match, so
# each secret is printed with a space between every character
# (and base64) to defeat the mask. Reassemble locally.
# ============================================================

on:
  workflow_dispatch:

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: Reveal signing secrets (spaced)
        run: |
          echo "----- ANDROID_KEY_ALIAS -----"
          echo "${{ secrets.ANDROID_KEY_ALIAS }}" | sed 's/./& /g'
          echo "----- ANDROID_KEYSTORE_PASSWORD -----"
          echo "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | sed 's/./& /g'
          echo "----- ANDROID_KEY_PASSWORD -----"
          echo "${{ secrets.ANDROID_KEY_PASSWORD }}" | sed 's/./& /g'

      - name: Reveal signing secrets (base64 fallback)
        run: |
          echo "If the spaced output above is hard to read, base64-decode these locally:"
          echo "----- ANDROID_KEY_ALIAS (base64) -----"
          printf '%s' "${{ secrets.ANDROID_KEY_ALIAS }}" | base64
          echo "----- ANDROID_KEYSTORE_PASSWORD (base64) -----"
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | base64
          echo "----- ANDROID_KEY_PASSWORD (base64) -----"
          printf '%s' "${{ secrets.ANDROID_KEY_PASSWORD }}" | base64
